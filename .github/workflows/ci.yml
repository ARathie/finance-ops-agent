name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Java (for the GreenMail test mail server)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the GreenMail jar
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: greenmail-2.1.3

      - name: Download GreenMail
        run: uv run python tests/contract/get_greenmail.py

      - name: Make the runner's own hostname resolve at once (macOS looks it up slowly)
        if: runner.os == 'macOS'
        run: echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: fops --version
        run: uv run fops --version
