name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Java (for the GreenMail test mail server)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the GreenMail jar
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: greenmail-2.1.3

      - name: Download GreenMail
        run: uv run python tests/contract/get_greenmail.py

      - name: rclone (the backup upload is tested against a folder as the remote)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install rclone; else sudo apt-get update && sudo apt-get install -y rclone; fi

      - name: Make the runner's own hostname resolve at once (macOS looks it up slowly)
        if: runner.os == 'macOS'
        run: echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: fops --version
        run: uv run fops --version

  image:
    # The container the server runs (docs/running-it.md stage 2). Built on
    # every push; published to GitHub Container Registry on a version tag.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t fops:ci .

      - name: fops --version inside the image
        run: docker run --rm fops:ci fops --version

      - name: Runs as a user of its own, not root
        run: test "$(docker run --rm fops:ci id -u)" != "0"

      - name: No .env anywhere in the image
        run: |
          # As root, so no folder is hidden from the search; find's complaints
          # about /proc and the like are not findings.
          found="$(docker run --rm --user 0 fops:ci sh -c 'find / -xdev -name ".env" 2>/dev/null || true')"
          test -z "$found" || { echo "found: $found"; exit 1; }

      - name: Stops cleanly on SIGTERM
        run: |
          docker run -d --name fops-stop \
            -e FOPS_TIMEZONE=America/New_York -e FOPS_ADMIN_EMAIL=kevin@example.com \
            -e FOPS_AGENT_MAILBOX=agent@example.com -e MAIL_USERNAME=agent@example.com \
            -e MAIL_PASSWORD=unused -e MAIL_IMAP_HOST=127.0.0.1 -e MAIL_IMAP_SECURITY=none \
            -e MAIL_SMTP_HOST=127.0.0.1 -e MAIL_SMTP_SECURITY=none \
            -e FOPS_ENGAGEMENT_LIST=/data/engagements.xlsx fops:ci
          sleep 5
          start=$(date +%s)
          docker stop --time 30 fops-stop
          took=$(( $(date +%s) - start ))
          docker logs fops-stop 2>&1 | tail -5
          test "$(docker inspect -f '{{.State.ExitCode}}' fops-stop)" = "0"
          test "$took" -lt 30

      - name: Publish (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/arathie/finance-ops-agent
          version="${GITHUB_REF_NAME#v}"
          docker tag fops:ci "$image:$version"
          docker tag fops:ci "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
