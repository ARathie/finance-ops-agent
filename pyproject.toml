[project]
name = "finance-ops-agent"
version = "0.1.0"
description = "Billing agent for Icon Technologies: reads consultant timesheets from email, prepares client invoices, and reports what consultants are owed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
]

[project.scripts]
fops = "finance_ops_agent.cli.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_ops_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Adapters may relax strictness where third-party types are missing
# (see docs/engineering-conventions.md). Add per-module overrides here
# only when a concrete third-party gap forces it, for example:
#
# [[tool.mypy.overrides]]
# module = "finance_ops_agent.adapters.excel.*"
# disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
